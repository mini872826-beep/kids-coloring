<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>小小绘本屋</title>
  <meta name="description" content="给小朋友的涂色绘本：车车、动物、恐龙、海洋生物线稿，多种笔刷和颜色，还能听故事。">
  <meta name="theme-color" content="#4fc3f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="绘本屋">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 首页 -->
  <section id="home" class="screen">
    <header class="home-header">
      <h1>🎨 小小绘本屋</h1>
      <nav class="tabs">
        <button class="tab" data-tab="paint">🖍️ 涂颜色</button>
        <button class="tab" data-tab="story">📖 听故事</button>
      </nav>
      <button id="installBtn" class="pill" hidden>⬇️ 安装</button>
    </header>
    <div id="cats" class="cats"></div>
    <div id="grid" class="grid"></div>
  </section>

  <!-- 涂色 -->
  <section id="paint" class="screen" hidden>
    <div id="board" class="board">
      <div id="stage" class="stage">
        <canvas id="cPaint"></canvas>
        <canvas id="cStroke"></canvas>
        <canvas id="cLines"></canvas>
      </div>
    </div>

    <aside class="toolbar">
      <div class="pair">
        <button id="doneBtn" class="sq green" aria-label="画好了">✔</button>
        <button id="photoBtn" class="sq blue" aria-label="存到相册">📷</button>
      </div>
      <button id="brushBtn" class="bigbtn" aria-label="选笔"></button>
      <button id="colorBtn" class="bigbtn" aria-label="选颜色"><span id="colorDot" class="dot"></span></button>
      <button id="eraserBtn" class="bigbtn" aria-label="橡皮擦"></button>
      <div class="pair">
        <button id="undoBtn" class="sq orange" aria-label="上一步">↩</button>
        <button id="clearBtn" class="sq yellow" aria-label="全部擦掉">🗑</button>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>
    <div id="brushPop" class="pop" hidden>
      <div id="brushList" class="brush-list"></div>
      <div id="sizes" class="sizes"></div>
    </div>
    <div id="colorPop" class="pop" hidden>
      <div id="colorGrid" class="color-grid"></div>
      <label class="more-color">🌈 更多颜色 <input id="customColor" type="color" value="#ff1f1f"></label>
    </div>

    <div id="confirm" class="modal" hidden>
      <div class="modal-box">
        <p>全部擦掉吗？</p>
        <div class="modal-actions">
          <button id="confirmYes" class="sq green big">✔</button>
          <button id="confirmNo" class="sq red big">✖</button>
        </div>
      </div>
    </div>

    <div id="photo" class="modal" hidden>
      <div class="modal-box">
        <img id="photoImg" alt="我的画">
        <p class="hint">长按图片可以存到相册</p>
        <button id="photoClose" class="sq green big">✔</button>
      </div>
    </div>
  </section>

  <!-- 阅读器 -->
  <section id="reader" class="screen" hidden>
    <div class="reader-top">
      <button id="homeBtn" class="round" aria-label="回首页">🏠</button>
      <div id="dots" class="dots"></div>
      <button id="autoBtn" class="round" aria-label="自动朗读">▶️</button>
    </div>
    <div id="page" class="page">
      <div id="art" class="art"></div>
      <p id="text" class="text"></p>
    </div>
    <div class="reader-bottom">
      <button id="prevBtn" class="round big" aria-label="上一页">⬅️</button>
      <button id="speakBtn" class="round big speak" aria-label="读给我听">🔊</button>
      <button id="nextBtn" class="round big" aria-label="下一页">➡️</button>
    </div>
  </section>

  <!-- 读完啦 -->
  <section id="done" class="screen" hidden>
    <div class="done-box">
      <div class="stars">⭐⭐⭐</div>
      <h2>太棒啦，读完啦！</h2>
      <div class="done-actions">
        <button id="againBtn" class="pill big">🔁 再读一遍</button>
        <button id="backBtn" class="pill big">🏠 回首页</button>
      </div>
    </div>
  </section>

  <div id="confetti" class="confetti"></div>

  <script src="js/art.js"></script>
  <script src="js/books.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
