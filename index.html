<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>小朋友愛畫畫</title>
  <meta name="description" content="給小朋友的塗色繪本：車車、動物、恐龍、海洋生物線稿，多種筆刷和顏色，還能聽故事。">
  <meta name="theme-color" content="#4fc3f7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小朋友愛畫畫">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@700;900&family=Nunito:wght@800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 首頁 -->
  <section id="home" class="screen">
    <div class="scenery" aria-hidden="true">
      <svg class="cloud c1" viewBox="0 0 200 90"><path d="M40 80 a30 30 0 0 1 8 -58 a40 40 0 0 1 72 -6 a32 32 0 0 1 52 30 a26 26 0 0 1 -10 34 z" fill="#fff"/></svg>
      <svg class="cloud c2" viewBox="0 0 200 90"><path d="M40 80 a30 30 0 0 1 8 -58 a40 40 0 0 1 72 -6 a32 32 0 0 1 52 30 a26 26 0 0 1 -10 34 z" fill="#fff"/></svg>
      <svg class="cloud c3" viewBox="0 0 200 90"><path d="M40 80 a30 30 0 0 1 8 -58 a40 40 0 0 1 72 -6 a32 32 0 0 1 52 30 a26 26 0 0 1 -10 34 z" fill="#fff"/></svg>
      <svg class="hills" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 120 Q200 40 420 110 T820 90 T1200 100 V200 H0 Z" fill="#a5e383"/><path d="M0 160 Q260 90 560 150 T1200 140 V200 H0 Z" fill="#7fd36b"/></svg>
    </div>
    <header class="home-header">
      <h1 class="logo"><span>小</span><span>朋</span><span>友</span><span>愛</span><span>畫</span><span>畫</span></h1>
    </header>
    <!-- 往下滑時，分頁和分類這一條會黏在最上面，隨時可以換 -->
    <div id="homeBar" class="home-bar">
     <div class="bar-row">
      <nav class="tabs">
        <button class="tab" data-tab="paint">🖍️ 塗顏色</button>
        <button class="tab" data-tab="story">📖 聽故事</button>
        <button class="tab" data-tab="song">🎵 兒歌唐詩</button>
        <button class="tab" data-tab="math">🔢 學數學</button>
        <button class="tab" data-tab="english">🔤 學英文</button>
      </nav>
      <button id="musicBtn" class="music-btn" aria-label="背景音樂">🎵</button>
      <button id="installBtn" class="pill" hidden>⬇️ 安裝</button>
     </div>
     <div id="cats" class="cats"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="version" class="version"></div>
  </section>
  <div id="toast" class="toast" hidden></div>

  <!-- 塗色 -->
  <section id="paint" class="screen" hidden>
    <div id="board" class="board">
      <div class="board-top">
        <button id="nameChip" class="name-chip" aria-label="念名字"></button>
        <div id="progress" class="progress" hidden><span><i></i></span><b></b></div>
      </div>
      <div id="stage" class="stage">
        <canvas id="cPaint"></canvas>
        <canvas id="cStroke"></canvas>
        <canvas id="cLines"></canvas>
      </div>
    </div>

    <aside class="toolbar">
      <div class="pair">
        <button id="doneBtn" class="sq green" aria-label="畫好了">
          <svg viewBox="0 0 48 48"><path d="M11 25 L20 34 L37 14" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="photoBtn" class="sq blue" aria-label="存到相簿">
          <svg viewBox="0 0 48 48"><path d="M8 17 Q8 13 12 13 L17 13 L20 9 L28 9 L31 13 L36 13 Q40 13 40 17 L40 35 Q40 39 36 39 L12 39 Q8 39 8 35 Z" fill="#fff"/><circle cx="24" cy="26" r="8" fill="#4d8ff0"/><circle cx="24" cy="26" r="4.5" fill="#fff"/><circle cx="34" cy="18" r="2" fill="#4d8ff0"/></svg>
        </button>
      </div>
      <div class="tools">
        <div class="tool"><button id="brushBtn" class="bigbtn" aria-label="選筆"></button><span class="lbl">畫筆</span></div>
        <div class="tool">
          <button id="colorBtn" class="bigbtn" aria-label="選顏色"><span id="colorDot" class="dot"></span></button><span class="lbl">顏色</span>
          <div id="recent" class="recent"></div>
        </div>
        <div class="tool"><button id="eraserBtn" class="bigbtn" aria-label="橡皮擦"></button><span class="lbl">橡皮擦</span></div>
      </div>
      <div class="pair">
        <button id="undoBtn" class="sq orange" aria-label="上一步">
          <svg viewBox="0 0 48 48"><path d="M17 20 L31 20 Q39 20 39 28 Q39 36 31 36 L20 36" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M8 20 L19 10 L19 30 Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
        </button>
        <button id="clearBtn" class="sq yellow" aria-label="全部擦掉">
          <svg viewBox="0 0 48 48"><rect x="9" y="12" width="30" height="5" rx="2.5" fill="#fff"/><rect x="19" y="7" width="10" height="6" rx="2" fill="#fff"/><path d="M12 19 L36 19 L33.5 40 Q33 42 31 42 L17 42 Q15 42 14.5 40 Z" fill="#fff"/><path d="M20 24 L20.5 37 M28 24 L27.5 37" stroke="#f4c234" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
      </div>
    </aside>

    <div id="scrim" class="scrim" hidden></div>
    <i id="popArrow" class="pop-arrow" hidden></i>
    <div id="brushPop" class="pop" hidden>
      <div id="brushList" class="brush-list"></div>
      <div id="sizes" class="sizes"></div>
      <button id="insideBtn" class="inside-toggle"></button>
    </div>
    <div id="colorPop" class="pop" hidden>
      <div id="patternRow" class="pattern-row" hidden></div>
      <div id="colorGrid" class="color-grid"></div>
      <label class="more-color">🌈 更多顏色 <input id="customColor" type="color" value="#ff1f1f"></label>
    </div>

    <div id="confirm" class="modal" hidden>
      <div class="modal-box">
        <p>全部擦掉嗎？</p>
        <div class="modal-actions">
          <button id="confirmYes" class="sq green big">✔</button>
          <button id="confirmNo" class="sq red big">✖</button>
        </div>
      </div>
    </div>

    <div id="photo" class="modal" hidden>
      <div class="modal-box">
        <img id="photoImg" alt="我的畫">
        <p class="hint">長按圖片可以存到相簿</p>
        <button id="photoClose" class="sq green big">✔</button>
      </div>
    </div>
  </section>

  <!-- 閱讀器 -->
  <section id="reader" class="screen" hidden>
    <div class="reader-top">
      <button id="homeBtn" class="round" aria-label="回首頁"><svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 22 L13 39 Q13 41 15 41 L21 41 L21 31 L27 31 L27 41 L33 41 Q35 41 35 39 L35 22" fill="currentColor"/></svg></button>
      <div class="reader-title"><h2 id="bookTitle"></h2><div id="dots" class="dots"></div></div>
      <button id="autoBtn" class="round" aria-label="自動朗讀"></button>
    </div>
    <div id="page" class="page">
      <div id="art" class="art"></div>
      <p id="text" class="text"></p>
    </div>
    <div class="reader-bottom">
      <button id="prevBtn" class="round big" aria-label="上一頁"><svg viewBox="0 0 48 48"><path d="M30 9 L14 24 L30 39" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="speakBtn" class="round big speak" aria-label="讀給我聽"><svg viewBox="0 0 48 48"><path d="M8 19 L16 19 L26 10 L26 38 L16 29 L8 29 Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M32 17 Q37 24 32 31 M36 12 Q45 24 36 36" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
      <button id="nextBtn" class="round big" aria-label="下一頁"><svg viewBox="0 0 48 48"><path d="M18 9 L34 24 L18 39" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <!-- 兒歌唐詩 -->
  <section id="song" class="screen" hidden>
    <div class="reader-top">
      <button id="songHome" class="round" aria-label="回首頁"><svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 22 L13 39 Q13 41 15 41 L21 41 L21 31 L27 31 L27 41 L33 41 Q35 41 35 39 L35 22" fill="currentColor"/></svg></button>
      <div class="reader-title"><h2 id="songTitle"></h2><div id="songSub" class="song-sub"></div></div>
      <button id="songRead" class="round" aria-label="念給我聽"><svg viewBox="0 0 48 48"><path d="M8 19 L16 19 L26 10 L26 38 L16 29 L8 29 Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M32 17 Q37 24 32 31 M36 12 Q45 24 36 36" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="page song-page">
      <div id="songArt" class="art"></div>
      <ol id="lyrics" class="lyrics"></ol>
    </div>
    <div class="reader-bottom">
      <button id="songPrev" class="round big" aria-label="上一首"><svg viewBox="0 0 48 48"><path d="M30 9 L14 24 L30 39" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="songPlay" class="round big speak" aria-label="播放"></button>
      <button id="songNext" class="round big" aria-label="下一首"><svg viewBox="0 0 48 48"><path d="M18 9 L34 24 L18 39" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </section>

  <!-- 學數學 -->
  <section id="math" class="screen" hidden>
    <div class="reader-top">
      <button id="mathHome" class="round" aria-label="回首頁"><svg viewBox="0 0 48 48"><path d="M8 24 L24 9 L40 24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 22 L13 39 Q13 41 15 41 L21 41 L21 31 L27 31 L27 41 L33 41 Q35 41 35 39 L35 22" fill="currentColor"/></svg></button>
      <div class="reader-title"><h2 id="mathTitle"></h2><div id="mathDots" class="dots"></div></div>
      <button id="mathSay" class="round" aria-label="再念一次"><svg viewBox="0 0 48 48"><path d="M8 19 L16 19 L26 10 L26 38 L16 29 L8 29 Z" fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M32 17 Q37 24 32 31 M36 12 Q45 24 36 36" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="mathPage" class="page math-page">
      <div id="mathVisual" class="math-visual"></div>
      <div id="mathQ" class="math-q"></div>
      <div id="mathChoices" class="math-choices"></div>
    </div>
    <div id="mathResult" class="modal" hidden>
      <div class="modal-box">
        <div id="mathStars" class="stars"></div>
        <p id="mathScore"></p>
        <div class="modal-actions">
          <button id="mathAgain" class="pill big">🔁 再玩一次</button>
          <button id="mathBack" class="pill big">🏠 回首頁</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 讀完啦 -->
  <section id="done" class="screen" hidden>
    <div class="done-box">
      <div class="stars">⭐⭐⭐</div>
      <h2>太棒啦，讀完啦！</h2>
      <div class="done-actions">
        <button id="againBtn" class="pill big">🔁 再讀一遍</button>
        <button id="backBtn" class="pill big">🏠 回首頁</button>
      </div>
    </div>
  </section>

  <div id="confetti" class="confetti"></div>

  <script src="js/version.js"></script>
  <script src="js/words.js"></script>
  <script src="js/art.js"></script>
  <script src="js/pack-vehicles.js"></script>
  <script src="js/pack-animals.js"></script>
  <script src="js/pack-dino-sea.js"></script>
  <script src="js/pack-places.js"></script>
  <script src="js/pack-food.js"></script>
  <script src="js/pack-nature.js"></script>
  <script src="js/pack-heroes.js"></script>
  <script src="js/pack-tops.js"></script>
  <script src="js/pack-ultra.js"></script>
  <script src="js/pack-ultra2.js"></script>
  <script src="js/books.js"></script>
  <script src="js/stories-manners.js"></script>
  <script src="js/stories-habits.js"></script>
  <script src="js/stories-classics.js"></script>
  <script src="js/stories-adventure.js"></script>
  <script src="js/stories-festivals.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/math.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
