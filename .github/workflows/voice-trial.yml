# 試聽：比較各種免費聲音（只在 voice-trial 分支跑，不影響 App）
name: 試聽聲音
on:
  push:
    branches: [voice-trial]
    paths: ['tools/trial_voices.py', '.github/workflows/voice-trial.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-trial
jobs:
  minimax:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: MiniMax 唱歌測試
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 tools/minimax_probe.py
      - name: 推回 voice-trial 分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial
          git commit -m "MiniMax singing trial" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin voice-trial && git push origin HEAD:voice-trial && break; sleep 5; done
  breezy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg sox libsox-dev
      - name: 安裝 BreezyVoice（CPU 版）
        run: |
          git clone --depth 1 --recursive https://github.com/mtkresearch/BreezyVoice.git bv
          sed -e 's/onnxruntime-gpu/onnxruntime/' -e '/extra-index-url/d' -e '/deepspeed/d' -e '/openai-whisper/d' bv/requirements.txt > req.txt
          pip install "setuptools<80" wheel
          pip install torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-build-isolation openai-whisper==20231117
          pip install -r req.txt
          pip install "ruamel.yaml<0.18"
      - name: BreezyVoice 錄音
        env:
          PYTHONUTF8: '1'
        run: python tools/trial_voices.py cv
      - name: 推回 voice-trial 分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial
          git commit -m "BreezyVoice trial" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin voice-trial && git push origin HEAD:voice-trial && break; sleep 5; done
