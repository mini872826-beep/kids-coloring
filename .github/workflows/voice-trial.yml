# 試聽：比較各種免費聲音（只在 voice-trial 分支跑，不影響 App）
name: 試聽聲音
on:
  push:
    branches: [voice-trial]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-trial
jobs:
  minimax:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: MiniMax 唱歌測試
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 tools/minimax_probe.py
      - name: 推回 voice-trial 分支
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial
          git commit -m "MiniMax singing trial" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin voice-trial && git push origin HEAD:voice-trial && break; sleep 5; done
