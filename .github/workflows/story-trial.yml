# 試聽：講故事的聲音（只在 story-trial 分支跑，結果推回這個分支的 trial/story/）
# 1. MiniMax 台灣腔念故事  2. 把 MiniMax、曉曉念的換成志工 1 的音色（Kaggle 上的 Seed-VC）
name: 講故事聲音試聽
on:
  push:
    branches: [story-trial]
    paths: ['trial/story_trial.py', 'trial/kaggle_vc/**', '.github/workflows/story-trial.yml']
permissions:
  contents: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts "kaggle>=1.8"
      - env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python trial/story_trial.py
      - name: 先推上去（Kaggle 從 GitHub 抓）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trial/story
          git commit -m "Story voice trial: MiniMax voices" || true
          for i in 1 2 3; do git pull --rebase origin story-trial && git push origin HEAD:story-trial && break; sleep 5; done
          # 等 GitHub 的原始檔網址抓得到新檔（Kaggle 從那裡下載）
          f=$(ls trial/story/mm-*.mp3 | head -1)
          for i in $(seq 1 30); do curl -sfI "https://raw.githubusercontent.com/${{ github.repository }}/story-trial/$f" >/dev/null && break; sleep 10; done
      - name: 換成志工 1 的音色
        env:
          KAGGLE_USERNAME: pacokids
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          python3 -c "
          import json, os
          src = sorted(f for f in os.listdir('trial/story') if f.endswith('.mp3') and (f.startswith('xiaoxiao-') or f.startswith('mm-')))
          jobs = [{'src': 'trial/story/' + f, 'out': 'vc1-' + f} for f in src] + [{'src': 'trial/story/' + f, 'out': 'vcf0-' + f, 'f0': True} for f in src]
          json.dump(jobs, open('$RUNNER_TEMP/jobs.json', 'w'))
          print(len(src), 'clips')"
          trial/kaggle_vc/kaggle.sh "$RUNNER_TEMP/jobs.json" story-trial trial/story/vc
          git add trial/story
          git commit -m "Story voice trial: volunteer 1 timbre" || true
          for i in 1 2 3; do git pull --rebase origin story-trial && git push origin HEAD:story-trial && break; sleep 5; done
