# 讀音檢查（AI 的耳朵）：用語音辨識把每一段錄音聽一遍，可疑的列在 listen/check/（網址 /listen/check/）
name: 讀音檢查
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/hear_check.py', '.github/workflows/hear-check.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: hear-check
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -q transformers numpy edge-tts soundfile opencc-python-reimplemented pypinyin
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ears-v1
      - run: python tools/hear_check.py
      - name: 推回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listen/check
          git commit -m "Pronunciation check report" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
