# 自動配音：有新的句子就用 AI 聲音錄成 mp3，推回 main，網站會自動更新
name: 產生配音

on:
  push:
    branches: [main]
    paths: ['js/**', 'tools/**', '.github/workflows/voice.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node tools/phrases.js > "$RUNNER_TEMP/phrases.json"
      # 中文旁白：Kaggle 免費 GPU 上用 BreezyVoice（志工 1 的聲音）錄還沒錄過的句子
      - run: python tools/gen_voice.py "$RUNNER_TEMP/phrases.json" --plan "$RUNNER_TEMP/jobs.json"
      - name: Kaggle 錄中文旁白
        continue-on-error: true
        env:
          KAGGLE_USERNAME: pacokids
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/jobs.json")" = 0 ]; then echo "都錄好了"; exit 0; fi
          pip install -q "kaggle>=1.8"
          tools/kaggle_voice/kaggle.sh "$RUNNER_TEMP/jobs.json" main audio
          rm -f audio/kaggle-voice-log.txt
      - run: python tools/gen_voice.py "$RUNNER_TEMP/phrases.json"
      # 兒歌：AI 一個字一個字錄，再照歌譜改音高，變成真的在唱（每個字的錄音存在 cache）
      - uses: actions/cache@v4
        with:
          path: .sing-cache
          key: sing-${{ hashFiles('js/songs.js') }}
          restore-keys: sing-
      - run: pip install "setuptools<80" pyworld soundfile numpy
      - run: node tools/songs.js > "$RUNNER_TEMP/songs.json"
      - run: python tools/sing.py "$RUNNER_TEMP/songs.json"
      - name: 推回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "沒有新的配音"; exit 0; fi
          git commit -m "Update voice audio"
          git pull --rebase origin main
          git push origin HEAD:main
          # 用 GITHUB_TOKEN 推的不會自動觸發 Pages，手動叫它重建
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
