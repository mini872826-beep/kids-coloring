# 自動配音：有新的句子就用 AI 聲音錄成 mp3，推回 main，網站會自動更新
name: 產生配音

on:
  push:
    branches: [main]
    paths: ['js/**', 'tools/**', '.github/workflows/voice.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # 排隊等的時候前一輪可能已經推了新的錄音：一律從最新的 main 開始，才不會重錄、推的時候打架
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts numpy soundfile
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node tools/phrases.js > "$RUNNER_TEMP/phrases.json"
      # 中文旁白：MiniMax 台灣腔講故事大姊姊
      - run: node tools/phrases.js --minimax > "$RUNNER_TEMP/minimax.json" && echo "MINIMAX_PHRASES=$RUNNER_TEMP/minimax.json" >> "$GITHUB_ENV"
      - run: node tools/phrases.js --story > "$RUNNER_TEMP/story.json" && echo "STORY_PHRASES=$RUNNER_TEMP/story.json" >> "$GITHUB_ENV"
      - name: MiniMax 錄音
        continue-on-error: true
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: pip install -q numpy soundfile opencc-python-reimplemented && python tools/minimax_voice.py
      # MiniMax 之外的中文（目前沒有）：Kaggle 免費 GPU 上用 BreezyVoice（志工 1）錄
      - run: python tools/gen_voice.py "$RUNNER_TEMP/phrases.json" --plan "$RUNNER_TEMP/jobs.json"
      - name: Kaggle 錄中文旁白
        continue-on-error: true
        env:
          KAGGLE_USERNAME: pacokids
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/jobs.json")" = 0 ]; then echo "都錄好了"; exit 0; fi
          pip install -q "kaggle>=1.8"
          tools/kaggle_voice/kaggle.sh "$RUNNER_TEMP/jobs.json" main audio
          mv audio/kaggle-voice-log.txt tools/kaggle_voice/last-log.txt 2>/dev/null || true
      - run: python tools/gen_voice.py "$RUNNER_TEMP/phrases.json"
      # 兒歌唱歌的部分在 sing-vc.yml（照歌譜唱好再換成自然歌聲）
      - name: 推回 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio tools/kaggle_voice/last-log.txt 2>/dev/null || git add audio
          if git diff --cached --quiet; then echo "沒有新的配音"; exit 0; fi
          git commit -m "Update voice audio"
          # 別的工作（兒歌）可能同時在推：先同步再推，失敗就再試
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 15; done
          # 用 GITHUB_TOKEN 推的不會自動觸發 Pages，手動叫它重建
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
