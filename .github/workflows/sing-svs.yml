# 兒歌 AI 歌手：先做八音盒伴奏和每句的時間（tools/sing.py），再到 Kaggle 免費 GPU 用 SoulX-Singer 照歌譜唱
name: 兒歌 AI 歌手
on:
  push:
    branches: [main]
    paths: ['js/songs.js', 'tools/sing.py', 'tools/accomp.py', 'tools/sing_svs.py', 'tools/kaggle_svs/**', 'tools/sing_kid.py', 'tools/kidvoice/run.py', 'tools/kidvoice/kaggle.sh', 'tools/voice/kid-sing-ref.mp3', '.github/workflows/sing-svs.yml']
  workflow_dispatch:
    inputs:
      only:
        description: '只做這幾首（id 用逗號分開，空白 = 全部）'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: sing-svs
jobs:
  sing:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # 排隊等的時候前一輪可能已經推了新的錄音：一律從最新的 main 開始，才不會重錄、推的時候打架
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # ffmpeg 轉檔；fluidsynth＋FluidR3 GM 音色庫（MIT）用來彈伴奏
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fluidsynth fluid-soundfont-gm rubberband-cli
      - uses: actions/cache@v4
        with:
          path: .sing-cache
          key: sing-${{ hashFiles('js/songs.js') }}
          restore-keys: sing-
      - run: pip install edge-tts "setuptools<80" pyworld soundfile numpy mido
      - run: node tools/songs.js > "$RUNNER_TEMP/songs.json"
      # 歌詞和音符要一個字配一個音，對不上就在這裡報錯
      - run: python tools/check_songs.py "$RUNNER_TEMP/songs.json"
      # 1. 編伴奏、算出每句的時間（Kaggle 要從 GitHub 抓伴奏，所以先推上去）
      - run: python tools/sing.py "$RUNNER_TEMP/songs.json"
      - name: 推人聲檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/sing
          if git diff --cached --quiet; then echo "人聲檔沒變"; exit 0; fi
          git commit -m "Update sung vocal stems"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
      # 2. Kaggle 上的 AI 歌手照譜唱
      - run: python3 tools/sing_svs.py "$RUNNER_TEMP/songs.json" --plan "$RUNNER_TEMP/jobs.json" "${{ github.event.inputs.only }}"
      - name: Kaggle AI 歌手
        continue-on-error: true
        env:
          KAGGLE_USERNAME: pacokids
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/jobs.json")" = 0 ]; then echo "都做好了"; exit 0; fi
          pip install -q "kaggle>=1.8"
          tools/kaggle_svs/kaggle.sh "$RUNNER_TEMP/jobs.json" main audio/sing-svs
          mv audio/sing-svs/kaggle-svs-log.txt tools/kaggle_svs/last-log.txt 2>/dev/null || true
      # 人聲對拍（rubberband）、跟伴奏混成成品
      - run: python3 tools/sing_svs.py "$RUNNER_TEMP/songs.json"
      # 3. 英文兒歌換成小朋友的聲音（Seed-VC），再對一次拍、配伴奏
      - run: python3 tools/sing_kid.py "$RUNNER_TEMP/songs.json" --plan "$RUNNER_TEMP/kid.json"
      - name: Kaggle 換成小朋友的聲音
        continue-on-error: true
        env:
          KAGGLE_USERNAME: pacokids
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ "$(python3 -c 'import json,sys;print(len(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/kid.json")" = 0 ]; then echo "都做好了"; exit 0; fi
          pip install -q "kaggle>=1.8"
          tools/kidvoice/kaggle.sh "$RUNNER_TEMP/kid.json" main audio/sing-kid/stems
          mv audio/sing-kid/stems/kaggle-kidvc-log.txt tools/kidvoice/last-log.txt 2>/dev/null || true
      - run: python3 tools/sing_kid.py "$RUNNER_TEMP/songs.json"
      - name: 推回 main
        run: |
          git add -A audio/sing-svs audio/sing-kid tools/kaggle_svs tools/kidvoice
          if git diff --cached --quiet; then echo "沒有新的歌"; exit 0; fi
          git commit -m "Update AI-singer songs"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
